<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MasFinder</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 15px;
        }

        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .spa-marker {
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 50%;
            border: 3px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const placeLatitude = 41.27584;
    const placeLongitude = 69.224277;

    const map = L.map("map", {
        zoomControl: true
    }).setView([placeLatitude, placeLongitude], 15);

    // Clean modern map
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        {
            attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
            subdomains: "abcd",
            maxZoom: 20
        }
    ).addTo(map);

    // Spa icon
    const spaIcon = L.divIcon({
        className: "",
        html: '<div class="spa-marker">💆</div>',
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -22]
    });

    // Place #1
    const marker = L.marker(
        [placeLatitude, placeLongitude],
        { icon: spaIcon }
    ).addTo(map);

    marker.bindPopup(`
        <div style="min-width:190px">
            <b style="font-size:17px;">Spa Salon</b>
            <br><br>
            💰 400,000–1,000,000 UZS
            <br>
            ☎️ +998945755528
            <br>
            ✈️ @Malak5528
        </div>
    `);
</script>

</body>
</html>
